# ─────────────────────────────────────────────────────────────────────────────
# wc-passes-model configuration
#
# This is the ONLY file you edit to retrain on new data.
#   • Add a new tournament  -> add a line under `statsbomb.competitions`
#   • Add friendlies/quals  -> add a line under `fbref.competitions`
#   • Re-run `python -m src.cli retrain` and the pipeline pulls only what's new.
#
# Find StatsBomb competition_id / season_id values with:
#   python -m src.cli list-competitions
# ─────────────────────────────────────────────────────────────────────────────

paths:
  raw: data/raw                 # cached per-match JSON/parquet (incremental, never re-pulled)
  processed: data/processed     # built feature tables
  models: models                # fitted model artifacts

# Event-level pass data (the TARGET label comes from here). Men's international
# tournaments only — this is the national-team training corpus.
statsbomb:
  # name is free-text; competition_id + season_id are what's pulled.
  competitions:
    - {name: "World Cup 2022",     competition_id: 43,  season_id: 106, provider: statsbomb, has_360: true}
    - {name: "World Cup 2018",     competition_id: 43,  season_id: 3,   provider: statsbomb, has_360: false}
    - {name: "Euro 2024",          competition_id: 55,  season_id: 282, provider: statsbomb, has_360: true}
    - {name: "Euro 2020",          competition_id: 55,  season_id: 43,  provider: statsbomb, has_360: true}
    - {name: "Copa America 2024",  competition_id: 223, season_id: 282, provider: statsbomb, has_360: false}
    - {name: "AFCON 2023",         competition_id: 1267, season_id: 107, provider: statsbomb, has_360: true}
  # IDs verified against the live StatsBomb catalog 2026-06-26 (all six confirmed).
  sb_cores: 4                   # parallelism for bulk pulls (SB_CORES env var)

# Form / minutes / lineups for friendlies + qualifiers. Post-2026-01-20 FBref no
# longer serves per-player PASSING, so these feed the minutes & recency features,
# NOT the pass label, unless `passing_available` is flipped on (paid feed mirror).
fbref:
  enabled: true
  rate_limit_seconds: 5         # respect FBref ~10 req/min
  passing_available: false      # set true only if you have a feed with pass counts
  competitions:
    - {name: "Intl Friendlies",          fbref_comp_id: 218, provider: opta}
    - {name: "WCQ UEFA",                 fbref_comp_id: 685, provider: opta}
    - {name: "WCQ CONMEBOL",             fbref_comp_id: 4,   provider: opta}
    - {name: "WCQ CONCACAF",             fbref_comp_id: 5,   provider: opta}
    # add other confederation qualifier comp ids as needed

# Underdog pick'em lines for backtesting & live edge.
underdog:
  enabled: true
  lines_csv: data/raw/underdog_lines.csv   # appended to daily; columns documented in ingest_underdog.py
  stat_name: "Passes"

features:
  recency_halflife_matches: 5            # exponential decay for player overall recent rate
  opponent_style_clusters: 4             # high-press / mid-block / low-block / direct
  style_recency_halflife_matches: 4      # recency decay for player-vs-STYLE rate (recency-biased)
  use_360_ball_depth: true               # only applied where has_360 is true
  min_minutes_for_label: 1               # rows with 0 minutes are DNPs (handled by minutes model)
  # Possession-Elo strength bake-in: adds g·elo_delta to the poss-Elo expected-share gap so
  # minnow blowouts (72% vs San Marino) stop inflating the rating. Validated g=0.3: WC2026
  # x_poss corr 0.767->0.786, MAE 7.0->6.8pp; passing buildup_bias +2.86->+2.47, CRPS -0.022.
  # BANKED AT 0.0 — the live model was trained on g=0 x_poss. >>> SET TO 0.3 AT THE NEXT RETRAIN <<<
  poss_elo_elodelta_g: 0.0
  # CONTINUOUS play-style: replace the hard style-BUCKET match in style_per90_recencybiased
  # with a Gaussian similarity kernel on a continuous possession-control axis (PC1 of the
  # team poss/vol/allow profile, ~82% of style variance). Discrete opp_style is UNCHANGED
  # (the rate model's player|opp_style random effect still needs discrete levels). 0/false =
  # original hard buckets. style_kernel_bw is in style-axis std units (smaller = tighter match).
  style_continuous: false
  style_kernel_bw: 1.0

model:
  backend: pymc                 # pymc | numpyro ; the hierarchical NB lives in rate_model.py
  draws: 500
  tune: 500
  chains: 2
  cores: 2                      # parallel chains, one per core (spawn ctx avoids macOS fork crash)
  target_accept: 0.9
  seed: 20260626
  # STRIKER box-touch emphasis: dedicated ST-only slope on box_ratio_asof (poacher vs
  # false-9), prior N(0, box_emphasis). 0 = off. 1.0 chosen from the A/B screen — best
  # striker CRPS (4.89->4.76), compresses the poacher(+3.8)/false-9(-3.0) split by ~1/3;
  # gains flatten past 1.0. See scripts/ab_axes.py boxemph variants.
  box_emphasis: 1.0
  # challenger (optional), selected only if it wins on out-of-sample CRPS
  challenger:
    enabled: false
    kind: lightgbmlss_nb

backtest:
  scheme: wc_chunked            # walk_forward (hold out each tournament) | wc_chunked (live-tournament)
  tournament: "World Cup 2026"  # wc_chunked: base = all data before it; then step through its games
  chunk_mode: round             # round (one chunk per group matchday: each team's 1st/2nd/3rd game) | days
  chunk_days: 1                 # wc_chunked days-mode: distinct match-dates per chunk; retrain per chunk
  min_plays_warn: 50            # warn if ROI rests on fewer plays than this
  recalibrate: isotonic
